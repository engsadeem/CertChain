name: certchainpro-final

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-certchain}
      MYSQL_USER: ${DB_USERNAME:-certchain_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CertChain@12345}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CertChainRoot@12345}
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - certchain_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - certchain

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: "no"
    env_file:
      - .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      NODE_BINARY: /usr/local/bin/node
    command: ["sh", "-lc", "php artisan migrate --force && php artisan db:seed --force"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - certchain

  app:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      NODE_BINARY: /usr/local/bin/node
    volumes:
      - certchain_storage:/var/www/html/storage
      - ./storage/app/public:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000,$$e,$$m,1); exit($$s ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - certchain

  queue:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      NODE_BINARY: /usr/local/bin/node
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=360", "--sleep=2"]
    volumes:
      - certchain_storage:/var/www/html/storage
      - ./storage/app/public:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    networks:
      - certchain

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - certchain

networks:
  certchain:
    driver: bridge

volumes:
  certchain_mysql_data:
  certchain_storage:
