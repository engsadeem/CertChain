server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # Laravel allows certificate PDFs up to 10 MiB. Keep nginx above that.
    client_max_body_size 16M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker health endpoint (does not expose application data).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Fingerprinted Vite assets can be cached aggressively.
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;

        # Blockchain registration can wait for on-chain confirmations.
        # BlockchainService allows up to 300 seconds for registration.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 390s;
        fastcgi_read_timeout 390s;
    }

    location ~ /\. {
        deny all;
    }
}
