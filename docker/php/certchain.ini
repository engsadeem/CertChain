; CertChain runtime settings
; Laravel validates certificate PDFs at max:10240 (10 MiB), so PHP
; must allow a slightly larger request before Laravel can validate it.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 360
max_input_time = 120

; Do not expose the PHP version in responses.
expose_php = Off

; Production-friendly OPcache defaults.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
